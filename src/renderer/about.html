<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/desktop-ui.css">
  <title>About Plotop</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg-window);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .app-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .app-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
    .version-table {
      width: 240px;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .version-table td {
      padding: 6px 0;
    }
    .version-table td:first-child {
      color: var(--text-secondary);
      text-align: left;
    }
    .version-table td:last-child {
      color: var(--text-primary);
      font-weight: 600;
      text-align: right;
    }
    .value-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #dddddd;
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .hidden {
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      min-height: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      text-align: center;
    }
    .status.error {
      color: var(--danger-color);
    }
    .status.success {
      color: #2e7d32;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="app-name">Plotop</div>
  <div class="app-subtitle">Real-time performance plotting</div>
  <table class="version-table">
    <tr>
      <td>Current Version</td>
      <td id="currentVersion">-</td>
    </tr>
    <tr>
      <td>Latest Version</td>
      <td>
        <div class="value-wrap">
          <span id="latestVersion">-</span>
          <span class="spinner" id="spinner"></span>
        </div>
      </td>
    </tr>
  </table>
  <div class="status" id="status"></div>
  <div class="buttons">
    <button class="app-button primary hidden" id="openReleaseBtn">Open Release Page</button>
    <button class="app-button" id="closeBtn">Close</button>
  </div>
  <script src="about.js"></script>
</body>
</html>
